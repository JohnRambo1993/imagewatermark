<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport Watermark</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        form {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 400px;
        }
        .field {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Passport Watermark</h1>
    <form action="/process" method="post">
        <div class="field">
            <label for="filename">Select Image:</label>
            <select name="filename" id="filename">
                {% for file in files %}
                    <option value="{{ file }}">{{ file }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label for="use_with">for use with:</label>
            <input type="text" name="use_with" id="use_with" required>
        </div>
        <div class="field">
            <label for="passphrase">passphrase:</label>
            <input type="password" name="passphrase" id="passphrase" required>
        </div>
        <button type="submit">Decrypt & Watermark</button>
    </form>
</body>
</html>
